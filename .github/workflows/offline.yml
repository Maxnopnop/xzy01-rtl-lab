name: Offline RTL validation
on: [push, pull_request, workflow_dispatch]
jobs:
  icarus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Validate evaluator and resumable runner
        run: python3 -m unittest -v test_lab test_batch test_dev test_fsm test_paired test_paired_audit
      - name: Audit retained paired experiment without model calls
        run: python3 paired_audit.py --evidence evidence/paired-a32 evidence/paired-b64 --output validation/paired-ci.json
